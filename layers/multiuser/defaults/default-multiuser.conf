server {
  auth_pam                  "Login";
  auth_pam_service_name     "nginx";
  listen 3000 default_server;
  listen [::]:3000 default_server;
  location SUBFOLDER {
    alias /usr/share/selkies/web/;
    index  index.html index.htm;
    try_files $uri $uri/ =404;
  }
  location SUBFOLDERapi {
    auth_request            /selkies-session;
    auth_request_set        $selkies_socket $upstream_http_x_selkies_socket;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_pass              http://unix:$selkies_socket:$request_uri;
  }
  location = /selkies-session {
    internal;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Remote-User $remote_user;
    proxy_read_timeout      90s;
    proxy_pass              http://unix:/run/selkies-broker.sock:/session;
  }
  error_page 500 502 503 504 /50x.html;
  location = SUBFOLDER50x.html {
    root /usr/share/selkies/web/;
  }
}

